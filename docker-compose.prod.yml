services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: librarium_db
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/scriptLibrarium.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: librarium-api:production
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      LIBRARIUM_JWT_SECRET: ${LIBRARIUM_JWT_SECRET:?Define LIBRARIUM_JWT_SECRET}
      LIBRARIUM_CORS_ALLOWED_ORIGINS: https://librarium.emserv.ovh
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/librarium_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Define MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp

volumes:
  mysql_data:
