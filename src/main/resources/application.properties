spring.application.name=LIBRARIUM
# Conexión a la Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3308/librarium_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=librariumROOT1234

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del Servidor
server.port=8080