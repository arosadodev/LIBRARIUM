spring.application.name=LIBRARIUM
spring.config.import=optional:file:.env[.properties]
librarium.jwt.secret=${LIBRARIUM_JWT_SECRET}
# Conexión a la Base de Datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/librarium_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Endpoint de salud usado por Docker y el orquestador.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Puerto del Servidor
server.port=8080
server.forward-headers-strategy=framework
librarium.cors.allowed-origins=${LIBRARIUM_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],https://librarium.emserv.ovh}
