spring.application.name=LIBRARIUM
spring.config.import=optional:file:.env[.properties]
librarium.jwt.secret=${LIBRARIUM_JWT_SECRET}
# Conexión a la Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3308/librarium_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=librariumROOT1234

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto del Servidor
server.port=8080